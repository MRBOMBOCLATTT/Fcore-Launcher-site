:root{
  --bg:#080a18;

  --panel-2:#171b36;

  --text:#eceefb;

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased}

a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px;position:relative;z-index:1}

.brand img{width:32px;height:32px;border-radius:8px;transition:transform .35s ease}

.brand-text{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.03em}
.nav-links{display:flex;align-items:center;gap:22px;font-size:14px;color:var(--text-dim)}
.nav-links a:hover{color:var(--text)}
.lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;padding:5px 10px;font-family:var(--mono);font-size:12px;color:var(--text-dim)}
.lang button.on{background:var(--accent);color:#fff}

.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid transparent;transition:transform .2s ease,background .2s ease,border-color .2s ease}

.btn-primary{background:var(--accent);color:#fff;box-shadow:0 10px 28px -12px rgba(71,78,216,.9)}

.btn-ghost{border-color:var(--border);background:var(--panel)}
.btn-ghost:hover{border-color:var(--accent)}

.hero{padding:76px 0 40px}
.hero-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center}
.hero h1{font-size:clamp(36px,5vw,60px);margin:14px 0 18px}
.hero h1 em{font-style:normal;color:var(--accent-hi)}
.lead{color:var(--text-dim);font-size:17px;max-width:480px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 18px}
.hero-meta{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.hero-visual{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.app-window{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:0 40px 80px -30px rgba(71,78,216,.55)}
.app-titlebar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--border)}
.tf{width:10px;height:10px;border-radius:50%;background:var(--border)}
.tt{margin-left:8px;font-family:var(--mono);font-size:11.5px;color:var(--text-dim)}
.shot{width:100%;height:auto}

section.block{padding:72px 0 8px}
.section-head{margin-bottom:34px}
.section-head h2{font-size:clamp(26px,3.4vw,38px);margin:10px 0 10px}
.section-head p{color:var(--text-dim);max-width:560px}

.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.feature-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:border-color .25s ease,transform .25s ease}
.feature-card:hover{border-color:var(--accent);transform:translateY(-4px)}

.feature-card h3{font-size:19px;margin-bottom:10px}
.feature-card p{color:var(--text-dim);font-size:14.5px}

.shot-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.shot-tab{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 18px;font-size:14px;color:var(--text-dim)}
.shot-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;counter-increment:s}
.step::before{content:"0" counter(s);font-family:var(--mono);color:var(--accent-hi);font-size:13px}
.step h3{font-size:18px;margin:8px 0}
.step p{color:var(--text-dim);font-size:14.5px}
.note{margin-top:16px;color:var(--text-dim);font-size:13.5px}
.note b{color:var(--text)}

.changelog{display:flex;flex-direction:column;gap:14px}
.cl-entry{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px}
.cl-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cl-version{font-family:var(--display);font-weight:700;font-size:19px}
.cl-date{font-family:var(--mono);font-size:12px;color:var(--text-dim)}
.cl-latest{font-family:var(--mono);font-size:11px;background:var(--accent);padding:2px 8px;border-radius:99px}
.cl-entry ul{padding-left:18px;color:var(--text-dim);font-size:14.5px}
.cl-entry li{margin:3px 0}
.cl-more{display:none;flex-direction:column;gap:14px}
.cl-more.shown{display:flex}
.cl-toggle-row{margin-top:16px}

.cta-band{margin:72px 0 0;padding:36px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(120deg,rgba(71,78,216,.3),var(--panel));display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.cta-band h2{font-size:26px;margin-bottom:6px}
.cta-band p{color:var(--text-dim)}

footer{margin-top:72px;border-top:1px solid var(--border);padding:28px 0 36px}

.fl{display:flex;gap:22px;font-size:14px;color:var(--text-dim)}
.fl a:hover{color:var(--text)}
.fine{margin-top:18px;font-size:12.5px;color:var(--text-dim);opacity:.7}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}

.egg-toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:var(--panel);border:1px solid var(--accent);font-family:var(--mono);font-size:12.5px;padding:12px 18px;border-radius:8px;z-index:5001;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}

.egg-fade.go{opacity:1;pointer-events:auto}
body.shake{animation:shake .4s ease}

@media(prefers-reduced-motion:reduce){

  .reveal{opacity:1;transform:none}

let lang = 'en';
let latestVersion = 'v1.7.5';
let releases = null;
let currentShot = 'home';

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function detectLang(){
  try {
    const saved = localStorage.getItem('fcore-lang');
    if (saved === 'ru' || saved === 'en') return saved;
  } catch (e) {}
  return (navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en';
}

function setStage(){
  const src = `${currentShot}-${lang}.jpg`;
  $('#stage').src = src;
  $$('.lang-shot').forEach(img => { img.src = `${img.dataset.shot}-${lang}.jpg`; });
  $$('.shot-tab').forEach(t => t.classList.toggle('on', t.dataset.shot === currentShot));
}

function renderChangelog(){
  const t = TEXT[lang];
  const items = releases || FALLBACK_LOG.map(r => ({ version: r.version, date: r.date, lines: r[lang] }));
  const list = $('#clList');
  const more = $('#clMore');
  list.innerHTML = '';
  more.innerHTML = '';
  items.forEach((entry, i) => {
    const box = document.createElement('div');
    box.className = 'cl-entry';
    const head = document.createElement('div');
    head.className = 'cl-head';
    const v = document.createElement('span');
    v.className = 'cl-version';
    v.textContent = `v${entry.version}`;
    const d = document.createElement('span');
    d.className = 'cl-date';
    d.textContent = entry.date;
    head.append(v, d);
    if (i === 0){
      const badge = document.createElement('span');
      badge.className = 'cl-latest';
      badge.textContent = t.latest;
      head.append(badge);
    }
    const ul = document.createElement('ul');
    entry.lines.forEach(line => {
      const li = document.createElement('li');
      li.textContent = line;
      ul.append(li);
    });
    box.append(head, ul);
    (i < 3 ? list : more).append(box);
  });
  $('#clToggle').style.display = items.length > 3 ? '' : 'none';
  $('#clToggle').textContent = more.classList.contains('shown') ? t.hide : t.showAll;
}

function applyLang(next){
  lang = next;
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  $$('[data-i]').forEach(el => {
    const value = t[el.dataset.i];
    if (typeof value === 'string') el.innerHTML = value;
  });
  $$('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  $('#heroMeta').textContent = t.meta(latestVersion);
  $('#featureGrid').innerHTML = t.features.map(f => `<div class="feature-card"><div class="fi">${f[0]}</div><h3>${f[1]}</h3><p>${f[2]}</p></div>`).join('');
  $('#steps').innerHTML = t.steps.map(s => `<div class="step"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');
  $('#stage').alt = t.tabHome;
  setStage();
  renderChangelog();
}

function cleanLine(line){
  return line.replace(/^\s*[-*+]\s+/, '').replace(/^#+\s*/, '').replace(/[*_`]/g, '').trim();
}

async function loadReleases(){
  try {
    const cached = sessionStorage.getItem('fcore-releases');
    if (cached) return JSON.parse(cached);
  } catch (e) {}
  const res = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=10`);
  if (!res.ok) throw new Error(res.status);
  const data = await res.json();
  try { sessionStorage.setItem('fcore-releases', JSON.stringify(data)); } catch (e) {}
  return data;
}

loadReleases().then(data => {
  const published = data.filter(r => !r.draft && !r.prerelease);
  if (!published.length) return;
  const newest = published[0];
  latestVersion = newest.tag_name.startsWith('v') ? newest.tag_name : `v${newest.tag_name}`;
  const exe = (newest.assets || []).find(a => /\.exe$/i.test(a.name));
  if (exe) $$('.dl-link').forEach(a => { a.href = exe.browser_download_url; });
  const withText = published.map(r => ({
    version: r.tag_name.replace(/^v/i, ''),
    date: (r.published_at || '').slice(0, 10),
    lines: (r.body || '').split('\n').map(cleanLine).filter(l => l && !/:$/.test(l) && !/^(FCore|PFC) Launcher\s+v?[\d.]+$/i.test(l)).slice(0, 8)
  })).filter(r => r.lines.length);
  if (withText.length) releases = withText;
  $('#heroMeta').textContent = TEXT[lang].meta(latestVersion);
  renderChangelog();
}).catch(() => {});

$$('.lang button').forEach(b => b.addEventListener('click', () => {
  try { localStorage.setItem('fcore-lang', b.dataset.lang); } catch (e) {}
  applyLang(b.dataset.lang);
}));

$$('.shot-tab').forEach(tab => tab.addEventListener('click', () => {
  currentShot = tab.dataset.shot;
  setStage();
}));

$('#clToggle').addEventListener('click', () => {
  $('#clMore').classList.toggle('shown');
  renderChangelog();
});

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting){
      entry.target.classList.add('in');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.12 });
$$('.reveal').forEach(el => observer.observe(el));

function showToast(text){
  const toast = $('#eggToast');
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 3200);
}

let logoClicks = 0;
let logoTimer = null;
$$('.brand').forEach(brand => brand.addEventListener('click', () => {
  logoClicks++;
  clearTimeout(logoTimer);
  logoTimer = setTimeout(() => { logoClicks = 0; }, 1200);
  if (logoClicks < 5) return;
  logoClicks = 0;
  document.body.classList.remove('shake');
  void document.body.offsetWidth;
  document.body.classList.add('shake');
  showToast(TEXT[lang].toast);
  setTimeout(() => {
    $('#eggFade').classList.add('go');
    setTimeout(() => { window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'; }, 500);
  }, 900);
}));

const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let konamiPos = 0;
window.addEventListener('keydown', e => {
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  konamiPos = key === KONAMI[konamiPos] ? konamiPos + 1 : (key === KONAMI[0] ? 1 : 0);
  if (konamiPos !== KONAMI.length) return;
  konamiPos = 0;
  document.documentElement.classList.add('party');
  showToast(TEXT[lang].party);
  setTimeout(() => document.documentElement.classList.remove('party'), 8000);
});

applyLang(detectLang());
</script>
</body>
</html>
